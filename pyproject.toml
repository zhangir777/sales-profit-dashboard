[project]
name = "sales-profit-dashboard"
version = "1.0.0"
description = "Orders and ad spend exports in, one-page profit dashboard (HTML) out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
build-dashboard = "dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
